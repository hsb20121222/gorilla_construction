<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Gorilla Constructions</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--base-font);
    }
    .nf-card {
      text-align: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 56px 40px;
      max-width: 460px;
      margin: 24px;
    }
    .nf-gorilla {
      width: 110px;
      height: 110px;
      border-radius: 20px;
      border: 2px solid var(--accent-gold);
      box-shadow: 0 0 30px var(--accent-gold-glow);
      margin-bottom: 24px;
      transform: rotate(-6deg);
    }
    .nf-code {
      font-family: var(--heading-font);
      font-size: 3rem;
      font-weight: 900;
      color: var(--accent-gold);
      letter-spacing: 4px;
    }
    .nf-title {
      font-family: var(--heading-font);
      font-size: 1.1rem;
      margin: 12px 0 8px;
    }
    .nf-text { color: var(--text-sub); font-size: 0.95rem; line-height: 1.6; margin-bottom: 24px; }
    .nf-btn {
      font-family: var(--heading-font);
      font-weight: 800;
      letter-spacing: 2px;
      color: #000;
      background: var(--accent-gold);
      border: 2px solid var(--accent-gold);
      padding: 14px 30px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      font-size: 0.9rem;
    }
    .nf-btn:hover { box-shadow: 0 0 25px var(--accent-gold-glow); transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="nf-card">
    <img class="nf-gorilla" src="/assets/images/logo.jpg" alt="Gorilla Constructions logo">
    <div class="nf-code">404</div>
    <div class="nf-title">OUR GORILLA ATE THIS PAGE</div>
    <p class="nf-text">The roller coaster is fine — two loops, two funnels, banana intact. This URL, however, does not exist.</p>
    <a class="nf-btn" href="/">BACK TO THE COASTER</a>
  </div>
</body>
</html>
